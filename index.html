<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Norwegian Greeting Widget</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: white;
        }

        body {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 40px;
            min-height: 100vh;
        }

        .greeting-container {
            font-size: 36px;
            font-weight: 300;
            letter-spacing: 0.5px;
            color: #1a1a1a;
            text-align: right;
            line-height: 1.5;
        }

        .greeting-text {
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div class="greeting-container">
        <div class="greeting-text" id="greeting">Loading...</div>
    </div>

    <script>
        function updateGreeting() {
            const hour = new Date().getHours();
            let greeting;

            if (hour >= 5 && hour < 12) {
                greeting = "God morgen, Susanne!";
            } else if (hour >= 12 && hour < 18) {
                greeting = "God ettermiddag, Susanne!";
            } else {
                greeting = "God kveld, Susanne!";
            }

            document.getElementById('greeting').textContent = greeting;
        }

        updateGreeting();
        
        // Update every minute
        setInterval(updateGreeting, 60000);
    </script>
</body>
</html>
